# ============================================================================
#  givn configuration  —  https://github.com/buster/givn
#  See arc42 chapter 8 (cross-cutting concepts) for detailed explanations.
#
#  How this file works:
#    - Commented lines (# ...) are the givn-managed documentation scaffold.
#      They may be refreshed by `givn upgrade` (which preserves your overrides).
#    - Uncommented key/value lines are user-owned and are never touched by
#      `givn upgrade`.
#    - To override a setting: uncomment the relevant key and edit its value.
