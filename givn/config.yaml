# Managed by givn. Do not delete the next line.
givn_config_version: "0.9.17"

# --- Test runner -------------------------------------------------------------
# The command givn invokes to run your test suite. Configured in
# givn/commands.yaml — NOT in this file. See givn/commands.yaml for the
# verify.command and verify.e2e_command keys.
#
# The shipped default is a sentinel that prints setup guidance and exits
# non-zero — so nothing ever falsely reports GREEN until you configure a
# real runner in givn/commands.yaml.
#

# --- Coverage gate (archive-level, requires addons.coverage: true) ------------
# Commands that run tests with coverage instrumentation. Configured in
# givn/commands.yaml — NOT in this file. See givn/commands.yaml for the
# coverage.measure_command and coverage.merge_command keys.
#

# --- E2E test runner ----------------------------------------------------------
# Configured in givn/commands.yaml — see verify.e2e_command there.
#

# --- Development record --------------------------------------------------------
# Givn records every lifecycle command and its inner steps, plus the activity
# its agent reporters (omp, opencode, Claude Code, Maki) report, under
# givn/history/ — an ignored local store, never repository content. See arc42
# ch.8.25. The mode is a project-owned value (this key survives `givn upgrade`):
#   off  — writes nothing new: no entry, no pending state, no ignore write.
#          `off` is absolute; `givn history ingest --with-full-content` is
#          ignored with one warning and exit 0.
#   on   — the default when the key is absent or unreadable (one warning):
#          all available metadata, with the label capped at 120 characters,
#          text metadata at 240, error text at 1 000, and full question text
#          at 4 000. No LLM-facing content.
#   full — `on` plus complete LLM-facing tool input/output, prompts, and
#          thinking text, capped at 64 KiB per field and 256 KiB per entry.
# Lowering the mode keeps entries already captured; it never purges them.
# `givn history settings [--json]` reports the resolved mode and its source
# (`config` or `default`). The intake enforces the mode and every bound.
#
# record:
#   mode: on                # on | off | full
#

# --- Artifact graph overlay --------------------------------------------------
# Patch the embedded default artifact graph without replacing it. Declare only
# the additions, modifications, or removals you want. Everything else keeps its
# default. See arc42 ch.8.2 for examples and full semantics.
#
# Examples:
#
#   # a) Remove a project-owned artifact you added earlier:
#   # artifacts:
#   #   - id: refactor
#   #     remove: true
#
#   # b) Make review optional (skip without blocking):
#   # artifacts:
#   #   - id: review
#   #     optional: true
#   # apply:
#   #   requires: [tasks]
#
#   # The embedded review gate cannot be removed: `remove: true` on it is
#   # refused. Optional still requires the artifact to be completed when used.
#
#   # c) Add a custom refactor step after implementation:
#   # artifacts:
#   #   - id: refactor
#   #     generates: ["refactor.md"]
#   #     requires: [tasks]
#   #     template: refactor.md
#   # apply:
#   #   requires: [tasks, refactor, review]

# --- Archive gate ------------------------------------------------------------
# Control which artifacts must be complete before `givn archive` succeeds.
# Default: [tasks, review]  — both must be done and their hooks must pass.
#
# apply:
#   requires: [tasks, review]
#   tracks: "tasks.md"         # file whose checkboxes givn tracks

# --- Hooks (post-artifact gate checks) ---------------------------------------
# Each artifact may declare `post:` hooks that run after it is completed.
# `givn check <artifact>` runs them on demand.
# `givn archive` auto-runs the hooks of all apply.requires artifacts as the gate.
#
# Built-in hook names:
#   verify      -> run verify.command (the test runner)
#   verify-e2e  -> run verify.e2e_command (the e2e smoke test runner).
#                  If any in-scope .feature file has an @e2e-tagged scenario,
#                  this hook HARD FAILS when verify.e2e_command is empty —
#                  it only skips silently when there is genuinely no @e2e
#                  scenario in scope. An @e2e scenario with no configured
#                  runner is an unenforced gap, never an acceptable default.
#   lint        -> run `givn lint` (static .feature check)
# Or: any shell command string.
# Object form adds options: { run: verify, allow_failure: false, name: "..." }
#
# A `post:` list is purely additive — it adds user hooks and never replaces
# the mandatory checks the binary owns:
#   `givn check tasks`  -> WIP protection and the test runner (verify)
#   `givn check review` -> integrity, the run-declaration check, and (for a
#                          named change) the overlap dispositions
#   `givn archive`      -> both verification scopes (regular and e2e) and the
#                          coverage gate when enabled
#
# Additive examples:
# artifacts:
#   - id: tasks
#     post: [lint]
#   - id: review
#     post:
#       - { run: verify, name: "full suite green" }
#       - { run: "scripts/coverage.sh", allow_failure: true }

# --- Addons ------------------------------------------------------------------
# Pre-packaged artifact sets. See arc42 ch.8.11.
# Every known addon is enabled by default. Opt out of all of them with
# `givn init --no-addons`, or disable one with `givn addons disable <name>`.
# A missing key in a partial `addons:` block means enabled; only an explicit
# `false` disables a flag. This project's actual settings are below, written by
# `givn init`/`givn addons`:
#
# addons:
#   arc42: true             # set to false to disable the arc42 documentation artifact
#   communication_policy: true # set to false to disable the managed communication
#                          # policy block in AGENTS.md. The dialog obligation is
#                          # mandatory and independent of this addon.
#   readme: true            # set to false to disable the readme scaffolding addon
#   coverage: true          # set to false to disable the coverage lifecycle artifact
#   domain_modeling: true   # project-level skill; see below
#   dev_principles: true    # project-level skill; see below
#   architecture_principles: true # enabled by default; set false to disable; see below
#   challenge: true         # project-level skill; see below
#   outline: true           # enabled by default; set false to disable the outline report
#                          # Toggle with: givn addons enable|disable <name>, or
#                          # `givn addons list` to see all known addons.

# --- arc42 documentation (requires addons.arc42: true) -----------------------
# Durable arc42 chapters live at the fixed path `docs/arc42/`, using the
# embedded twelve-chapter set. There is no output-dir or chapter-list setting.
#
# When addons.arc42 is true, the arc42 document is produced during the
# design phase and checked in design-review: design-review requires
# arc42-docs, and arc42-docs itself gates archive (added to apply.requires) --
# an enabled-but-unfinished arc42 doc blocks `givn archive`, not just the
# "ready-to-archive" status label.

# --- Addon: domain_modeling ---------------------------------------------------
# Skill — model a change's domain before design. Maintains the standalone
# `docs/glossary.md` and `docs/domain-model.md`; it does not require arc42.
# Generates the givn-domain-modeling skill file on
# `givn skills sync`. Toggle with: givn addons enable|disable domain_modeling.
#

# --- Addon: dev_principles ----------------------------------------------------
# Skill — apply the team's engineering principles during implementation.
# Generates the givn-dev-principles skill file on `givn skills sync`.
# Toggle with: givn addons enable|disable dev_principles.
#

# --- Addon: architecture_principles -------------------------------------------
# Architecture-principles guidance (enabled by default): answer questions at
# their last responsible moment; design the consumer's contract now, defer the
# component split. Gates the `architecture-principles` instruction and its
# proposal, design, design-review, dialog, review, and tasks references.
# Toggle with: givn addons enable|disable architecture_principles.
#

# --- Addon: communication_policy ---------------------------------------------
# Presentation policy — manage a fenced communication block in AGENTS.md.
# The dialog obligation from `givn instructions dialog` is mandatory with or
# without this addon. Toggle with: givn addons enable|disable communication_policy.
#

# --- Addon: challenge ---------------------------------------------------------
# Skill — research the subject first, cite available evidence, label hypotheses,
# and reserve questions for unresolved human decisions. Applies to proposals,
# tests, specs, design, code, and whole changes without adding a lifecycle gate.
# Generates the givn-challenge skill on `givn skills sync`.
# Toggle with: givn addons enable|disable challenge.
#

# --- Generated-rules policy ---------------------------------------------------
# Whether Givn's generated rules (skills, plugins, hooks, and the attribution
# plumbing) are repository content or stay on this machine.
#   local-only  (default) - the rules are written locally and kept out of the
#                           repository; a tracked rule is removed from the
#                           current revision without deleting its file.
#   versioned             - the rules are repository content, staged and
#                           committed like source.
# An absent key resolves to local-only. An unrecognized value warns and
# continues as local-only. AGENTS.md is never staged by Givn under either
# policy; the fenced ignore block is project content and may be committed.
#
# rules: local-only

# --- Skill agent targets ------------------------------------------------------
# Which agent targets receive the generated skills.
# `givn init` requires a selection: the interactive prompt opens with opencode
# marked and re-asks until something is marked; scripts pass --agents, and a
# missing or unknown-only selection is refused.
# `givn skills sync` installs to exactly the persisted targets, falling back
# to opencode when no skills block exists. Toggle by editing the list below
# (allowed values: opencode, agents, claude, omp, maki).
#
# skills:
#   targets: [opencode]      # set to e.g. [opencode, agents, claude, omp, maki] for all

# --- Instruction extensions ---------------------------------------------------
# Project-owned rules that extend any served instruction
# (`givn instructions <id>`). The extension lives in this project-owned
# configuration: it is effective at the next request, and synchronization and
# upgrades never touch it. Ids name an artifact, policy, or step instruction;
# a rule is a non-empty string. An unknown id or a malformed entry warns and
# is skipped, and the built-in rules are served alone.
#
# Example — two instructions, two project rules each. A rule listed under
# several ids extends each of those instructions:
#
# extensions:
#   ideation:
#     - Keep raw ideas free of implementation detail.
#     - Link every open question to the Persona it affects.
#   specs:
#     - Keep scenarios free of implementation detail.
#     - Use the project's domain vocabulary in every scenario title.

# --- User overrides preserved from previous version ---
addons:
  arc42: true
  communication_policy: true
  readme: false
  coverage: false
  domain_modeling: true
  dev_principles: true
  challenge: true
skills:
  targets: [opencode, agents, claude, omp, maki]
rules: local-only
artifacts:
  - id: tasks
    post:
      - { run: "python3 scripts/givn-spec-trace.py", name: "spec traceability" }
      - verify
  - id: review
    post:
      - { run: "python3 scripts/givn-spec-trace.py", name: "spec traceability" }
      - verify
      - verify-e2e
# ---
