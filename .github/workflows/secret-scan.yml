# Server-side guard: evaluate the repository with the in-tree stub `private`
# input (never the private flake) and scan for secrets. The hygiene rule is a
# flake check, so `nix flake check` runs it here.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nix >= 2.26 is required: the `private` input is a relative path
      # (`path:./private-stub`), which older releases reject when reading
      # flake.lock as an "unlocked input".
      - uses: cachix/install-nix-action@v31
      - name: evaluate the repository without private access
        run: nix flake check
      - name: scan for secrets
        run: nix run nixpkgs#gitleaks -- detect --no-banner --redact
